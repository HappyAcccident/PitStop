<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PitStop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="food-item">
    <div class="empty-space"></div>
    
    <div class="card">
      <div id="top-bar">
        <div id="nutrition-bar">
          <div class="nutrition-info bg-blue-100"><strong>NUTRITION DETAILS</strong></div>
          <div class="nutrition-info bg-yellow-100"><strong>LOW CAL</strong></div>
          <div class="nutrition-info bg-red-100"><strong>LOW FAT</strong></div>
        </div>
        <button id="exit-btn"><svg id="exit-btn-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M6 18L18 6M6 6l12 12"></path></svg></button>
      </div>
    
    <div class="divider"></div>
    
    <div id="food-card">
      <p id="food-name"><strong>Blueberry Muffins</strong></p>
      <p id="time-served"><strong>BREAKFAST (7AM-11AM)</strong></p>
    </div>
  
    <div class="divider"></div>
  
    <div id="cal-card">
      <p class="gray-text small-text"><strong>TOTAL CALORIES</strong></p>
      <p><span id="calories"><strong>180 </strong></span><span class="gray-text">kcal</span></p>
      <p><strong><span class="gray-text small-text">SERVING: </span><span id="serving-size">0.5</span> cup<span class="black-text"></strong></p>
    </div>
  
    <div class="divider"></div>
  
    <div id="macro-bar">
      <div class="macro bg-blue-100">
        <p class="gray-text small-text"><strong>PROTEIN</strong></p>
        <p><strong><span class="macro-num" id="protein-num">0</span>g</strong></p>
      </div>
    
      <div class="macro bg-yellow-100">
        <p class="gray-text small-text"><strong>CARBS</strong></p>
        <p><strong><span class="macro-num" id="carbs-num">0</span>g</strong></p>
      </div>
    
      <div class="macro bg-red-100">
        <p class="gray-text small-text"><strong>FAT</strong></p>
        <p><strong><span class="macro-num" id="fat-num">0</span>g</strong></p>
      </div>
    </div>
  
    <div id="dietary-card">
      <span class="small-text"><strong>Dietary Information</strong></span>
      <div id="dietary-bar">
        <div class="dietary-info">Halal</div>
        <div class="dietary-info">Gluten Free</div>
        <div class="dietary-info">Vegan</div>
        <div class="dietary-info">Vegetarian</div>
      </div>
    </div>
  
    <div id="allergens-card">
      <span class="small-text"><strong>Allergens</strong></span>
      <p class="small-text">Soy, Peanuts</p>
    </div>
  
    <div class="empty-space"></div>
  </div>
</body>
</html>
