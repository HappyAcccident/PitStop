<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PitStop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="list-view">
    <strong id="title-span"><header id="title">PitStop</header></strong>

    <div class="station-divider">
      <div class="divider"></div>The Kitchen Table<div class="divider"></div>
    </div>

    <section class="station" id="the-kitchen-table"></section>

    <div class="station-divider">
      <div class="divider"></div>The Grill<div class="divider"></div>
    </div>

    <section class="station" id="the-grill"></section>

    <div class="station-divider">
      <div class="divider"></div>Plant Forward<div class="divider"></div>
    </div>

    <section class="station" id="plant-forward"></section>

    <div class="station-divider">
      <div class="divider"></div>Waffle Bar<div class="divider"></div>
    </div>

    <section class="station" id="waffle-bar"></section>
  </main>

  <main id="food-view">
    <div class="empty-space"></div>
    
    <div class="card">
      <strong><span id="station"></span></strong>
      <section id="top-bar">
        <div id="nutrition-bar"></div>
        <button id="exit-btn"><svg id="exit-btn-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M6 18L18 6M6 6l12 12"></path></svg></button> <!--stolen from random website-->
      </section>
    

      <section id="food-card">
        <strong><p id="food-name"></p></strong>
        <strong><p id="time-served"></p></strong>
      </section>
    
      <div class="divider"></div>
    
      <section id="cal-card">
        <p class="gray-text small-text"><strong>TOTAL CALORIES</strong></p>
        <p><strong><span class="calories" id="calories"></span></strong><span class="gray-text"> kcal</span></p>
        <p><strong><span class="gray-text small-text">SERVING: </span><span id="serving-size"></span></strong></p>
      </section>
    
      <div class="divider"></div>
    
      <section id="macro-bar">
        <div class="macro bg-green-100">
          <p class="gray-text small-text"><strong>PROTEIN</strong></p>
          <p><strong><span class="macro-num" id="protein-num"></span>g</strong></p>
        </div>
      
        <div class="macro bg-yellow-100">
          <p class="gray-text small-text"><strong>CARBS</strong></p>
          <p><strong><span class="macro-num" id="carbs-num">0</span>g</strong></p>
        </div>
      
        <div class="macro bg-red-100">
          <p class="gray-text small-text"><strong>FAT</strong></p>
          <p><strong><span class="macro-num" id="fat-num">0</span>g</strong></p>
        </div>
      </section>
    
      <section id="dietary-card">
        <span class="small-text"><strong>Dietary Information</strong></span>
        <div id="dietary-bar"></div>
      </section>
    
      <section id="allergens-card">
        <span class="small-text"><strong>Allergens</strong></span>
        <p class="small-text" id="allergens"></p>
      </section>
    
      <div class="empty-space"></div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
