<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PitStop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="list-view">
    <strong><span id="title">PitStop</span></strong>

    <div class="station-divider">
      <div class="divider"></div>
      The Kitchen Table
      <div class="divider"></div>
    </div>

    <div class="station" id="the-kitchen-table">
      <button class="card food-item">
        <strong><span>Buttermilk Pancakes</span></strong>
        <span><strong><span class="blue-text">180</span></strong> kcal</span>
      </button>
    </div>

    <div class="station-divider">
      <div class="divider"></div>
      The Grill
      <div class="divider"></div>
    </div>

    <div class="station-divider">
      <div class="divider"></div>
      Plant Forward
      <div class="divider"></div>
    </div>

    <div class="station-divider">
      <div class="divider"></div>
      Waffle Bar
      <div class="divider"></div>
    </div>
  </div>

  <div id="food-view">
    <div class="empty-space"></div>
    
    <div class="card">
      <strong><span id="station"></span></strong>
      <div id="top-bar">
        <div id="nutrition-bar"></div>
        <button id="exit-btn"><svg id="exit-btn-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M6 18L18 6M6 6l12 12"></path></svg></button>
      </div>
    

      <div id="food-card">
        <strong><p id="food-name"></p></strong>
        <strong><p id="time-served"></p></strong>
      </div>
    
      <div class="divider"></div>
    
      <div id="cal-card">
        <p class="gray-text small-text"><strong>TOTAL CALORIES</strong></p>
        <p><strong><span class="calories" id="calories"></span></strong><span class="gray-text"> kcal</span></p>
        <p><strong><span class="gray-text small-text">SERVING: </span><span id="serving-size"></span></strong></p>
      </div>
    
      <div class="divider"></div>
    
      <div id="macro-bar">
        <div class="macro bg-green-100">
          <p class="gray-text small-text"><strong>PROTEIN</strong></p>
          <p><strong><span class="macro-num" id="protein-num"></span>g</strong></p>
        </div>
      
        <div class="macro bg-yellow-100">
          <p class="gray-text small-text"><strong>CARBS</strong></p>
          <p><strong><span class="macro-num" id="carbs-num">0</span>g</strong></p>
        </div>
      
        <div class="macro bg-red-100">
          <p class="gray-text small-text"><strong>FAT</strong></p>
          <p><strong><span class="macro-num" id="fat-num">0</span>g</strong></p>
        </div>
      </div>
    
      <div id="dietary-card">
        <span class="small-text"><strong>Dietary Information</strong></span>
        <div id="dietary-bar"></div>
      </div>
    
      <div id="allergens-card">
        <span class="small-text"><strong>Allergens</strong></span>
        <p class="small-text" id="allergens"></p>
      </div>
    
      <div class="empty-space"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
